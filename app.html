<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Take</title>
<meta name="description" content="Entra a First Take como creador o como negocio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* =========================================================
   FIRST TAKE · estilos de la app
   Creadores: tema claro (papel). Negocios: tema oscuro (estudio).
   ========================================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper: #FAF6EF;
  --paper-2: #F1EADF;
  --ink: #1C1A17;
  --rec: #C8372D;
  --ok: #2F6B45;

  --bg: var(--paper);
  --surface: #FFFFFF;
  --surface-2: var(--paper-2);
  --text: var(--ink);
  --muted: #7A7062;
  --border: #E4DACB;

  --display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --ui: 'Figtree', 'Helvetica Neue', Arial, sans-serif;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
}

body[data-theme="biz"] {
  --bg: #171512;
  --surface: #211E1A;
  --surface-2: #2B2722;
  --text: #F3EEE5;
  --muted: #A69C8B;
  --border: #37322C;
}

html { scroll-behavior: smooth; }
body { font-family: var(--ui); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
h1, h2, h3, .display { font-family: var(--display); font-weight: 400; letter-spacing: -0.005em; }
:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; border-radius: 4px; }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--text); background: transparent; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { background: var(--text); opacity: .88; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-ok:hover { background: var(--ok); opacity: .9; }
.btn-ghost { border-color: var(--border); }
.btn-danger { border-color: rgba(200,55,45,.4); color: var(--rec); }
.btn-sm { padding: 7px 14px; font-size: .82rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; }

/* ---------- formularios ---------- */
.field { display: block; }
.field + .field { margin-top: 16px; }
.field > span { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
.in { width: 100%; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); font-size: .95rem; }
.in:focus { outline: 2px solid var(--text); outline-offset: 0; }
textarea.in { min-height: 100px; resize: vertical; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.err { font-size: .85rem; color: var(--rec); margin-top: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: .86rem; cursor: pointer; }
.pick.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* =========================================================
   ACCESO
   ========================================================= */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; background: var(--paper); color: var(--ink); }
.auth-photo { position: relative; background: #3C332B center/cover no-repeat; min-height: 100vh; }
.auth-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(0,0,0,.6)); }
.auth-photo blockquote { position: absolute; left: 40px; right: 40px; bottom: 44px; z-index: 2; color: #FAF6EF; font-family: var(--display); font-size: 2rem; line-height: 1.15; max-width: 520px; }
.auth-photo blockquote small { display: block; font-family: var(--ui); font-size: .9rem; margin-top: 12px; opacity: .85; }
.auth-side { display: flex; flex-direction: column; padding: 32px 56px; }
.auth-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: auto; }
.auth-top .logo { font-family: var(--display); font-size: 1.6rem; }
.auth-top a:not(.logo) { font-size: .9rem; color: var(--muted); }
.auth-form { width: 100%; max-width: 420px; margin: 40px 0 auto; }
.auth-form h1 { font-size: 2.6rem; line-height: 1.05; margin-bottom: 10px; }
.auth-form > p.lead { color: #5A5247; margin-bottom: 28px; }
.steps { display: flex; gap: 6px; margin-bottom: 26px; }
.steps i { flex: 1; height: 4px; border-radius: 4px; background: #E4DACB; }
.steps i.on { background: var(--ink); }
.step-lbl { font-size: .82rem; color: var(--muted); margin-bottom: 8px; }
.auth-foot { font-size: .88rem; color: var(--muted); margin-top: 22px; }
.demo-box { margin-top: 28px; padding-top: 22px; border-top: 1px solid #E4DACB; }
.demo-box p { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
.demo-box .btn { margin: 0 8px 8px 0; }

/* elección de rol */
.choose { min-height: 100vh; display: flex; flex-direction: column; background: var(--ink); }
.choose-top { display: flex; justify-content: space-between; align-items: center; padding: 22px 32px; color: var(--paper); }
.choose-top .logo { font-family: var(--display); font-size: 1.6rem; }
.choose-top a:not(.logo) { font-size: .9rem; opacity: .75; }
.choose-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.door { position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 44px; min-height: 520px; background: #3C332B center/cover no-repeat; color: #FAF6EF; overflow: hidden; }
.door::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.72)); transition: background .25s ease; }
.door:hover::before { background: linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.82)); }
.door > * { position: relative; z-index: 1; }
.door h2 { font-size: 3.2rem; line-height: 1; margin-bottom: 12px; }
.door p { max-width: 380px; opacity: .9; margin-bottom: 24px; }
.door .btn { background: #FAF6EF; color: var(--ink); border-color: #FAF6EF; align-self: flex-start; }
.door .sub { margin-top: 14px; font-size: .88rem; opacity: .85; }
.door .sub a { text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================
   CASCARÓN DE LA APP
   ========================================================= */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 26px; padding: 24px 16px; border-right: 1px solid var(--border); background: var(--bg); }
.side-logo { font-family: var(--display); font-size: 1.55rem; padding: 0 10px; }
.side-role { display: inline-block; margin: 4px 10px 0; font-size: .75rem; color: var(--muted); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: var(--r-sm); color: var(--muted); font-size: .94rem; }
.side nav a:hover { color: var(--text); }
.side nav a.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
.side nav svg { width: 19px; height: 19px; flex-shrink: 0; }
.side nav .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--rec); color: #fff; font-size: .72rem; font-weight: 700; display: grid; place-items: center; }
.side-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--border); }
.side-user b { display: block; font-size: .88rem; line-height: 1.2; }
.side-user span { font-size: .78rem; color: var(--muted); }
.side-user button { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: .8rem; cursor: pointer; text-decoration: underline; }
.mtop { display: none; }

.main { padding: 38px 48px 90px; max-width: 1200px; width: 100%; }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
.pagehead h1 { font-size: 2.7rem; line-height: 1.02; }
.pagehead .lead { color: var(--muted); margin-top: 8px; max-width: 580px; }
.back { display: inline-flex; font-size: .9rem; color: var(--muted); margin-bottom: 18px; }
.back:hover { color: var(--text); }
.sechead { display: flex; justify-content: space-between; align-items: baseline; margin: 40px 0 16px; gap: 12px; }
.sechead h2 { font-size: 1.75rem; }
.sechead a { font-size: .9rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; }
.panel h2 { font-size: 1.5rem; margin-bottom: 14px; }
.empty { border: 1px dashed var(--border); border-radius: var(--r-md); padding: 34px 22px; text-align: center; color: var(--muted); }
.empty .btn { margin-top: 14px; }

.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.05rem; color: #FAF6EF; flex-shrink: 0; }
.avatar.lg { width: 84px; height: 84px; font-size: 2rem; }
.avatar.sm { width: 32px; height: 32px; font-size: .9rem; }

/* estados */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill-pendiente { color: #A06A12; background: rgba(183,121,31,.13); }
.pill-aceptada { color: #3A64A8; background: rgba(58,100,168,.13); }
.pill-entregada { color: #7B4FA3; background: rgba(123,79,163,.14); }
.pill-verificada { color: #2F7D4F; background: rgba(47,125,79,.14); }
.pill-rechazada { color: var(--muted); background: var(--surface-2); }
body[data-theme="biz"] .pill-aceptada { color: #8DB0EA; }
body[data-theme="biz"] .pill-entregada { color: #C4A0E8; }
body[data-theme="biz"] .pill-verificada { color: #7FCB9C; }
body[data-theme="biz"] .pill-pendiente { color: #E8B566; }
.tag { display: inline-flex; font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }

.rec { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 700; color: var(--rec); letter-spacing: .02em; }
.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: rec 1.6s ease-in-out infinite; }
@keyframes rec { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } * { scroll-behavior: auto !important; } }

/* ---------- claqueta (nivel) ---------- */
.slate { background: var(--ink); color: var(--paper); border-radius: var(--r-md); overflow: hidden; border: 1px solid #2A2621; }
.slate-bar { height: 30px; background: repeating-linear-gradient(-45deg, var(--paper) 0 16px, var(--ink) 16px 32px); border-bottom: 3px solid var(--ink); }
.slate-body { padding: 18px 22px 20px; }
.slate-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.slate-head b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; }
.slate-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; border-top: 1px solid #3A3631; border-bottom: 1px solid #3A3631; }
.slate-grid > div { padding: 12px 0 12px 16px; border-left: 1px solid #3A3631; }
.slate-grid > div:first-child { padding-left: 0; border-left: 0; }
.slate small { display: block; font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: #A69C8B; margin-bottom: 4px; }
.slate-num { font-family: var(--display); font-size: 3.6rem; line-height: .9; }
.slate-val { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; }
.prog { height: 6px; background: #3A3631; border-radius: 6px; overflow: hidden; margin: 16px 0 8px; }
.prog i { display: block; height: 100%; background: var(--paper); border-radius: 6px; }
.slate p { font-size: .85rem; color: #CFC6B6; }

/* ---------- inicio creador ---------- */
.home-grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 20px; align-items: start; }
.live { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--border); }
.live:first-of-type { border-top: 0; padding-top: 4px; }
.live-img { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--surface-2); flex-shrink: 0; }
.live-img img { width: 100%; height: 100%; object-fit: cover; }
.live-txt { flex: 1; min-width: 0; }
.live-txt b { display: block; font-size: .95rem; }
.live-txt span { font-size: .84rem; color: var(--muted); }

/* ---------- tarjetas de colaboración ---------- */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.ocard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; transition: border-color .15s ease; }
.ocard:hover { border-color: var(--text); }
.ocard.locked { opacity: .62; }
.ocard-img { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); overflow: hidden; }
.ocard-img img { width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 12px; left: 12px; background: var(--paper); color: var(--ink); font-size: .8rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; }
.badge.right { left: auto; right: 12px; background: var(--ink); color: var(--paper); font-weight: 600; }
.ocard-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.ocard-biz { font-size: .82rem; color: var(--muted); }
.ocard h3 { font-size: 1.4rem; line-height: 1.12; }
.deal { font-size: .88rem; }
.deal b { font-weight: 600; margin-right: 4px; }
.ocard-foot { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }

.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .in { max-width: 320px; }
.toolbar select.in { max-width: 200px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

/* ---------- detalle de colaboración ---------- */
.hero-img { position: relative; height: 300px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface-2); margin-bottom: 26px; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; }
.hero-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55)); }
.hero-img .hero-txt { position: absolute; left: 28px; right: 28px; bottom: 24px; z-index: 1; color: #FAF6EF; }
.hero-img h1 { font-size: 2.6rem; line-height: 1.05; }
.hero-img p { opacity: .9; margin-top: 6px; }
.detail { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
.terms { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; margin-bottom: 18px; }
.terms > div { padding: 16px 18px; }
.terms > div + div { border-left: 1px solid var(--border); }
.terms small { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.terms p { font-size: .98rem; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

.bars > div { display: grid; grid-template-columns: 140px 1fr 36px; gap: 12px; align-items: center; font-size: .88rem; margin-bottom: 11px; }
.bar { height: 7px; border-radius: 7px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); border-radius: 7px; }
.score-big { font-family: var(--display); font-size: 3.4rem; line-height: 1; }

/* ---------- tablero por etapas ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 16px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: var(--r-md); padding: 14px; min-height: 240px; }
.col h3 { font-family: var(--ui); font-size: .92rem; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 12px; }
.col h3 span { color: var(--muted); font-weight: 500; }
.mini { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.mini:hover { border-color: var(--text); }
.mini b { display: block; font-size: .9rem; line-height: 1.3; margin: 4px 0; }
.mini span { font-size: .8rem; color: var(--muted); }

/* ---------- acuerdo + chat ---------- */
.agreement { border: 1px dashed var(--text); border-radius: var(--r-md); padding: 20px; }
.agreement h3 { font-size: 1.35rem; margin-bottom: 10px; }
.agreement ul { list-style: none; }
.agreement li { font-size: .92rem; padding: 8px 0; border-top: 1px solid var(--border); }
.agreement li:first-child { border-top: 0; }
.track { display: flex; gap: 6px; margin: 16px 0 6px; }
.track i { flex: 1; height: 5px; border-radius: 5px; background: var(--surface-2); }
.track i.on { background: var(--text); }
.track-lbl { display: grid; grid-template-columns: repeat(4, 1fr); font-size: .76rem; color: var(--muted); }
.track-lbl span:nth-child(2), .track-lbl span:nth-child(3) { text-align: center; }
.track-lbl span:last-child { text-align: right; }

.chat { display: flex; flex-direction: column; height: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.chat-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.chat-head b { font-size: .95rem; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: .92rem; background: var(--surface-2); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--text); color: var(--bg); border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
.msg time { display: block; font-size: .7rem; opacity: .6; margin-top: 3px; }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.chat-form .in { border-radius: 999px; }
.chat-closed { padding: 26px; text-align: center; color: var(--muted); font-size: .9rem; margin: auto; max-width: 280px; }

.stars { color: #C9971C; letter-spacing: 2px; }
.star-pick { display: flex; gap: 2px; }
.star-pick button { background: none; border: 0; font-size: 1.8rem; color: var(--border); cursor: pointer; line-height: 1; }
.star-pick button.on { color: #C9971C; }

/* ---------- portafolio ---------- */
.profile { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; margin-bottom: 8px; }
.who { display: flex; gap: 20px; align-items: center; margin-bottom: 16px; }
.who h1 { font-size: 2.4rem; line-height: 1.05; }
.stats { display: flex; gap: 32px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1; }
.stats span { font-size: .82rem; color: var(--muted); }
.work { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.work-img { aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
.work-img img { width: 100%; height: 100%; object-fit: cover; }
.work-body { padding: 16px 18px; }
.work-body h3 { font-size: 1.25rem; margin: 6px 0 2px; }
.work-body q { display: block; font-size: .88rem; margin-top: 8px; }

/* ---------- negocio ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 26px; background: var(--surface); }
.kpis > a, .kpis > div { padding: 20px 22px; }
.kpis > * + * { border-left: 1px solid var(--border); }
.kpis b { display: block; font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1; }
.kpis span { font-size: .85rem; color: var(--muted); }
.biz-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; align-items: start; }
.todo { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); }
.todo:first-of-type { border-top: 0; padding-top: 4px; }
.todo-txt { flex: 1; }
.todo-txt b { display: block; font-size: .95rem; }
.todo-txt span { font-size: .84rem; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

.table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
.table th { text-align: left; font-size: .8rem; font-weight: 600; color: var(--muted); padding: 14px 18px; border-bottom: 1px solid var(--border); }
.table td { padding: 16px 18px; border-bottom: 1px solid var(--border); font-size: .92rem; vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }

/* ---------------- ESTADO ---------------- */
const KEY = 'firsttake-v2';
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 2) return s; } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function nid(p) { S.seq += 1; return p + S.seq; }
/* Hash simple solo para no guardar contraseñas en texto plano dentro del demo.

function hash(s) { let h = 5381; for (const c of String(s)) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'h' + (h >>> 0).toString(16); }

const byId = (list, id) => list.find(x => x.id === id);

const offer = id => byId(S.offers, id);

function me() { return S.session ? byId(S.users, S.session) : null; }
function meC() { const u = me(); return u && u.role === 'creator' ? creator(u.profileId) : null; }
function meB() { const u = me(); return u && u.role === 'biz' ? biz(u.profileId) : null; }
const appsOfCreator = cid => S.apps.filter(a => a.creatorId === cid);
const offersOfBiz = bid => S.offers.filter(o => o.bizId === bid);
const appsOfBiz = bid => { const ids = offersOfBiz(bid).map(o => o.id); return S.apps.filter(a => ids.includes(a.offerId)); };

function verifiedOf(cid) { return S.apps.filter(a => a.creatorId === cid && a.status === 'verificada'); }
function levelOf(cid) {
  const n = verifiedOf(cid).length;
  let lv = LEVELS[0];
  for (const L of LEVELS) if (n >= L.min) lv = L;
  return { ...lv, count: n, next: LEVELS[lv.n + 1] };
}
function ratingOf(cid) {
  const r = verifiedOf(cid).filter(a => a.rating);
  return r.length ? r.reduce((s, a) => s + a.rating, 0) / r.length : null;
}
const usedSlots = oid => S.apps.filter(a => a.offerId === oid && ['aceptada', 'entregada', 'verificada'].includes(a.status)).length;
const slotsLeft = o => Math.max(0, o.slots - usedSlots(o.id));

/* distancia entre colonias (haversine, km) */
function km(a, b) {
  const [la1, lo1] = COLONIAS[a] || COLONIAS['Metepec Centro'];
  const [la2, lo2] = COLONIAS[b] || COLONIAS['Metepec Centro'];
  const r = Math.PI / 180, R = 6371;
  const h = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------------- ALGORITMO 1: colaboraciones para un creador ----------------
   45% nicho + 40% cercanía + 15% cupos. Bloqueada si no tiene el nivel mínimo. */
function matchOffer(o, cid) {
  const c = creator(cid), d = km(c.colonia, o.colonia);
  const nicho = c.nicho.includes(o.category) ? 1 : 0.3;
  const cerca = Math.max(0, 1 - d / 12);
  const cupos = slotsLeft(o) > 0 ? 1 : 0;
  const score = Math.round(100 * (0.45 * nicho + 0.40 * cerca + 0.15 * cupos));
  return { o, b: biz(o.bizId), d, nicho, cerca, cupos, score, locked: levelOf(cid).n < o.minLevel };
}
function recommendedFor(cid) {
  return S.offers.filter(o => o.status === 'abierta').map(o => matchOffer(o, cid))

}

/* ---------------- ALGORITMO 2: aplicantes para un negocio ----------------
   30% nicho + 25% cercanía + 25% calificación + 20% nivel. Sin seguidores. */
function rankApplicant(a) {
  const o = offer(a.offerId), c = creator(a.creatorId), d = km(c.colonia, o.colonia);
  const nicho = c.nicho.includes(o.category) ? 1 : 0.3;
  const cerca = Math.max(0, 1 - d / 12);
  const r = ratingOf(c.id);
  const calif = r == null ? 0.6 : r / 5;
  const nivel = levelOf(c.id).n / 3;
  return { a, c, d, nicho, cerca, calif, nivel, r, score: Math.round(100 * (0.30 * nicho + 0.25 * cerca + 0.25 * calif + 0.20 * nivel)) };
}

const $ = s => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function first(name) { return String(name).split(' ')[0]; }
function initials(n) { return String(n).split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
function colorFor(id) { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 997; return COLORES[h % COLORES.length]; }
function avatar(id, name, size) { return `<span class="avatar ${size || ''}" style="background:${colorFor(id)}" aria-hidden="true">${esc(initials(name))}</span>`; }
function fecha(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); }
function hora(iso) { const d = new Date(iso); return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }
function daysLeft(iso) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(iso + 'T00:00:00') - t) / 864e5); }
function leftTxt(iso) { const n = daysLeft(iso); return n < 0 ? 'fecha vencida' : n === 0 ? 'vence hoy' : n === 1 ? 'queda 1 día' : `quedan ${n} días`; }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }
const PILL = { pendiente: 'Esperando respuesta', aceptada: 'Aceptada', entregada: 'Entregada', verificada: 'Verificada', rechazada: 'No seleccionada' };
function pill(s) { return `<span class="pill pill-${s}">${PILL[s]}</span>`; }
function plural(n, a, b) { return `${n} ${n === 1 ? a : b}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }

function shell(content) {
  const u = me(), isC = u.role === 'creator';
  const p = isC ? meC() : meB();
  const h = location.hash;
  let links;
  if (isC) {
    const n = appsOfCreator(p.id).filter(a => a.status === 'aceptada').length;
    links = [['#/inicio', 'Inicio', 'home'], ['#/explorar', 'Explorar', 'search', ['#/oferta']], ['#/colabs', 'Colaboraciones', 'board', ['#/colab'], n], ['#/portafolio', 'Portafolio', 'star'], ['#/perfil', 'Perfil', 'user']];
  } else {
    const n = appsOfBiz(p.id).filter(a => a.status === 'pendiente' || a.status === 'entregada').length;
    links = [['#/resumen', 'Resumen', 'grid', [], n], ['#/colaboraciones', 'Colaboraciones', 'list', ['#/gestionar', '#/colab', '#/creador']], ['#/nueva', 'Publicar', 'plus'], ['#/perfil', 'Negocio', 'store']];
  }
  const nav = links.map(([href, lbl, ic, also, count]) => {
    const on = h.startsWith(href) || (also || []).some(x => h.startsWith(x));
    return `<a href="${href}" class="${on ? 'on' : ''}" ${on ? 'aria-current="page"' : ''}>${icon(ic)}<span>${lbl}</span>${count ? `<em class="count">${count}</em>` : ''}</a>`;
  }).join('');
  return `<div class="shell">
    <aside class="side">
      <div><a class="side-logo" href="${isC ? '#/inicio' : '#/resumen'}">First Take</a><br><span class="side-role">${isC ? 'Para creadores' : 'Para negocios'}</span></div>
      <nav aria-label="Principal">${nav}</nav>
      <div class="side-user">${avatar(p.id, p.name, 'sm')}<div><b>${esc(isC ? first(p.name) : p.name)}</b><span>${esc(u.email)}</span></div><button type="button" data-logout>Salir</button></div>
    </aside>
    <div>
      <div class="mtop"><a class="side-logo" href="${isC ? '#/inicio' : '#/resumen'}">First Take</a><span>${isC ? 'Creadores' : 'Negocios'}</span></div>
      <main class="main" id="main">${content}</main>
    </div>
  </div>`;
}

function slate(c) {
  const lv = levelOf(c.id), r = ratingOf(c.id);
  const pct = lv.next ? Math.round(100 * (lv.count - lv.min) / (lv.next.min - lv.min)) : 100;
  return `<div class="slate" aria-label="Nivel ${esc(lv.name)}">
    <div class="slate-bar"></div>
    <div class="slate-body">
      <div class="slate-head"><b>${esc(c.name)}</b><span class="small" style="color:#A69C8B">${esc(c.handle)}</span></div>
      <div class="slate-grid">
        <div><small>Toma</small><span class="slate-num">${lv.n}</span></div>
        <div><small>Verificadas</small><span class="slate-val">${lv.count}</span></div>
        <div><small>Calificación</small><span class="slate-val">${r ? r.toFixed(1) : '—'}</span></div>
      </div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <p>${lv.next ? `Nivel ${esc(lv.name)}. ${plural(lv.next.min - lv.count, 'colaboración verificada', 'colaboraciones verificadas')} más para ${lv.next.name}.` : 'Nivel máximo: Toma 3.'}</p>
    </div>
  </div>`;
}

function offerCard(m, opts) {
  opts = opts || {};
  const { o, b, d, score, locked } = m;
  const left = slotsLeft(o);
  return `<article class="ocard ${locked ? 'locked' : ''}" ${opts.preview ? '' : `data-go="#/oferta/${o.id}"`}>
    <div class="ocard-img">${img(o.img || CAT[o.category], 640, 480, o.title)}
      <span class="badge">${opts.preview ? 'Vista previa' : `${score}% match`}</span>
      ${locked ? `<span class="badge right">Desde ${LEVELS[o.minLevel].name}</span>` : ''}
    </div>
    <div class="ocard-body">
      <span class="ocard-biz">${esc(b.name)} · ${esc(o.colonia)}${opts.preview ? '' : ` · ${d.toFixed(1)} km`}</span>
      <h3>${esc(o.title || 'Título de tu colaboración')}</h3>
      <p class="deal"><b>Recibes</b>${esc(o.gives || '—')}</p>
      <p class="deal"><b>Entregas</b>${esc(o.asks || '—')}</p>
      <div class="ocard-foot"><span class="tag">${esc(o.category)}</span><span class="tag">${left ? plural(left, 'cupo', 'cupos') : 'Sin cupos'}</span><span class="tag">Hasta ${fecha(o.deadline)}</span></div>
    </div>
  </article>`;
}

function bar(label, v, peso) { return `<div><span>${label}${peso ? ` <span class="muted">${peso}</span>` : ''}</span><span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span><b class="small">${Math.round(v * 100)}</b></div>`; }

function track(st) {
  const idx = { pendiente: 0, aceptada: 1, entregada: 2, verificada: 3 }[st];
  if (idx == null) return '';
  return `<div class="track">${[0, 1, 2, 3].map(i => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>
  <div class="track-lbl"><span>Aplicación</span><span>Acuerdo</span><span>Entrega</span><span>Verificada</span></div>`;
}

function agreement(a) {
  const o = offer(a.offerId), b = biz(o.bizId), c = creator(a.creatorId);
  return `<div class="agreement">
    <h3>Acuerdo ${esc(a.id.toUpperCase())}</h3>
    <ul>
      <li><b>${esc(b.name)}</b> da: ${esc(o.gives)}</li>
      <li><b>${esc(c.name)}</b> entrega: ${esc(o.asks)}</li>
      <li>Publicar antes del ${fecha(o.deadline)} (${leftTxt(o.deadline)})</li>
      <li>Al confirmar la entrega, la colaboración queda verificada en el portafolio de ${esc(first(c.name))}.</li>
    </ul>
  </div>`;
}

function chat(a, side) {
  const o = offer(a.offerId), b = biz(o.bizId), c = creator(a.creatorId);
  const other = side === 'creator' ? b : c;
  const open = ['aceptada', 'entregada', 'verificada'].includes(a.status);
  const ms = msgsOf(a.id);
  return `<section class="chat" aria-label="Mensajes con ${esc(other.name)}">
    <div class="chat-head">${avatar(other.id, other.name, 'sm')}<div><b>${esc(other.name)}</b><div class="small muted">${side === 'creator' ? esc(b.colonia) : esc(c.handle)}</div></div></div>
    ${open ? `<div class="chat-log" id="chat-log">${ms.length ? ms.map(m => `<div class="msg ${m.from === side ? 'me' : ''}">${esc(m.text)}<time>${hora(m.at)}</time></div>`).join('') : `<p class="chat-closed">Todavía no hay mensajes. Pónganse de acuerdo en día y hora.</p>`}</div>
    <form class="chat-form" id="f-chat" data-id="${a.id}"><input class="in" name="text" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje" required><button class="btn btn-primary btn-sm" type="submit">Enviar</button></form>`
    : `<p class="chat-closed">${a.status === 'rechazada' ? 'Esta aplicación no fue seleccionada.' : 'El chat se abre cuando el negocio acepta la aplicación.'}</p>`}
  </section>`;
}

function workCard(a) {
  const o = offer(a.offerId), b = biz(o.bizId);
  return `<article class="work">
    <div class="work-img">${img(o.img || CAT[o.category], 640, 400, o.title)}</div>
    <div class="work-body">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="tag">${esc(o.category)}</span><span class="pill pill-verificada">Verificada</span></div>
      <h3>${esc(o.title)}</h3>
      <span class="small muted">con ${esc(b.name)}</span>
      <div class="stars" style="margin-top:6px" aria-label="${a.rating || 5} de 5">${stars(a.rating || 5)}</div>
      ${a.review ? `<q>${esc(a.review)}</q>` : ''}
    </div>
  </article>`;
}

function portfolio(c, editable) {
  const vs = verifiedOf(c.id).slice().reverse();
  return `
  <div class="profile">
    <div class="panel">
      <div class="who">${avatar(c.id, c.name, 'lg')}<div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.handle)} · ${esc(c.colonia)}</p></div></div>
      <p>${esc(c.bio || '')}</p>
      <div class="facts" style="margin:16px 0 0">${c.nicho.map(n => `<span class="tag">${esc(n)}</span>`).join('')}${(c.formatos || []).map(n => `<span class="tag">${esc(n)}</span>`).join('')}</div>
      <div class="stats">
        <div><b>${verifiedOf(c.id).length}</b><span>colaboraciones verificadas</span></div>
        <div><b>${ratingOf(c.id) ? ratingOf(c.id).toFixed(1) : '—'}</b><span>calificación promedio</span></div>
        <div><b>${Number(c.followers || 0).toLocaleString('es-MX')}</b><span>seguidores</span></div>
      </div>
      ${editable ? `<a class="btn btn-ghost btn-sm" href="#/perfil" style="margin-top:18px">Editar perfil</a>` : ''}
    </div>
    ${slate(c)}
  </div>
  <div class="sechead"><h2>Portafolio verificado</h2><span class="small muted">Cada pieza la confirmó el negocio</span></div>
  ${vs.length ? `<div class="cards">${vs.map(workCard).join('')}</div>` : `<div class="empty">Todavía no hay colaboraciones verificadas.${editable ? '<br><a class="btn btn-primary btn-sm" href="#/explorar">Buscar mi primera colaboración</a>' : ''}</div>`}`;
}

   INTERFAZ DE CREADORES
   ========================================================= */
function cInicio() {
  const c = meC(), mine = appsOfCreator(c.id);
  const live = mine.filter(a => a.status === 'aceptada' || a.status === 'entregada');
  const waiting = mine.filter(a => a.status === 'pendiente').length;

  return `

}

let fx = { q: '', cat: '', sort: 'match' };
function exploreResults() {
  const c = meC();

  if (fx.sort === 'cerca') list.sort((x, y) => (x.locked - y.locked) || x.d - y.d);
  if (fx.sort === 'pronto') list.sort((x, y) => (x.locked - y.locked) || x.o.deadline.localeCompare(y.o.deadline));
  return list.length ? `<div class="cards">${list.map(m => offerCard(m)).join('')}</div>` : `<div class="empty">No encontramos colaboraciones con esos filtros.</div>`;

      <div class="actions" style="margin-top:20px"><button class="btn btn-primary" type="submit">Publicar</button><a class="btn btn-ghost" href="#/colaboraciones">Cancelar</a></div>
    </form>
    <div class="preview-wrap"><p>Así la verán los creadores</p><div id="preview">${previewCard()}</div></div>
  </div>`;
}

function bGestionar(id) {
  const o = offer(id), b = meB();
  if (!o || o.bizId !== b.id) return notFound();
  const all = S.apps.filter(a => a.offerId === id);
  const pend = all.filter(a => a.status === 'pendiente').map(rankApplicant).sort((x, y) => y.score - x.score);
  const live = all.filter(a => a.status === 'aceptada' || a.status === 'entregada');
  const done = all.filter(a => a.status === 'verificada' || a.status === 'rechazada');
  const left = slotsLeft(o);
  return `
  <a class="back" href="#/colaboraciones">← Colaboraciones</a>
  <div class="hero-img" style="height:220px">${img(o.img || CAT[o.category], 1400, 440, o.title)}<div class="hero-txt"><p>${o.status === 'abierta' ? `${plural(left, 'cupo libre', 'cupos libres')} de ${o.slots} · publicar antes del ${fecha(o.deadline)}` : 'Cerrada'}</p><h1>${esc(o.title)}</h1></div></div>
  <div class="terms"><div><small>Ofreces</small><p>${esc(o.gives)}</p></div><div><small>Pides</small><p>${esc(o.asks)}</p></div></div>
  <div class="sechead" style="margin-top:28px"><h2>Aplicantes</h2><a href="#/algoritmo">Cómo se ordenan</a></div>
  <p class="small muted" style="margin:-8px 0 16px">Ordenados por nicho, cercanía, calificación y nivel. El número de seguidores no cuenta.</p>
  ${pend.length ? `<div class="grid2">${pend.map((r, i) => {
    const lv = levelOf(r.c.id);
    return `<article class="applicant ${i === 0 ? 'top' : ''}">
      <div class="applicant-head">${avatar(r.c.id, r.c.name)}<div><a href="#/creador/${r.c.id}"><b>${esc(r.c.name)}</b></a><div class="small muted">${esc(r.c.handle)} · ${r.d.toFixed(1)} km</div></div><div class="score"><b>${r.score}</b><span>${i === 0 ? 'mejor opción' : 'puntaje'}</span></div></div>
      <q>${esc(r.a.pitch)}</q>
      <div class="facts" style="margin:0"><span class="tag">${esc(lv.name)}</span><span class="tag">${plural(lv.count, 'verificada', 'verificadas')}</span><span class="tag">${r.r ? '★ ' + r.r.toFixed(1) : 'Sin calificaciones'}</span></div>
      <div class="bars">${bar('Nicho', r.nicho)}${bar('Cercanía', r.cerca)}${bar('Calificación', r.calif)}${bar('Nivel', r.nivel)}</div>
      <div class="actions"><button class="btn btn-ok btn-sm" type="button" data-accept="${r.a.id}" ${left ? '' : 'disabled'}>Aceptar</button><button class="btn btn-danger btn-sm" type="button" data-reject="${r.a.id}">No por ahora</button><a class="btn btn-ghost btn-sm" href="#/creador/${r.c.id}">Ver portafolio</a></div>
    </article>`;
  }).join('')}</div>` : `<div class="empty">No hay aplicaciones nuevas.</div>`}
  ${live.length ? `<div class="sechead"><h2>En curso</h2></div><div class="grid2">${live.map(a => { const c = creator(a.creatorId); return `<a class="applicant" href="#/colab/${a.id}"><div class="applicant-head">${avatar(c.id, c.name)}<div><b>${esc(c.name)}</b><div class="small muted">${esc(c.handle)}</div></div><div class="score">${a.status === 'aceptada' ? '<span class="rec">Grabando</span>' : pill('entregada')}</div></div><span class="small muted">${a.status === 'entregada' ? 'Entregó: ' + esc(a.link) + '. Confirma para verificar.' : 'Abrir acuerdo y chat'}</span></a>`; }).join('')}</div>` : ''}
  ${done.length ? `<div class="sechead"><h2>Historial</h2></div><div class="grid2">${done.map(a => { const c = creator(a.creatorId); return `<a class="applicant" href="${a.status === 'verificada' ? '#/colab/' + a.id : '#/creador/' + c.id}" style="flex-direction:row;align-items:center">${avatar(c.id, c.name, 'sm')}<b style="flex:1">${esc(c.name)}</b>${pill(a.status)}</a>`; }).join('')}</div>` : ''}
  ${o.status === 'abierta' ? `<div style="margin-top:34px"><button class="btn btn-danger btn-sm" type="button" data-close="${o.id}">Cerrar colaboración</button></div>` : ''}`;
}

function bCreador(id) {
  const c = creator(id);
  if (!c) return notFound();
  return `<a class="back" href="javascript:history.back()">← Volver</a>${portfolio(c, false)}`;
}

function bPerfil() {
  const b = meB(), u = me();
  return `
  <header class="pagehead"><div><h1>Tu negocio</h1><p class="lead">Los creadores ven esta información en cada colaboración que publicas.</p></div></header>
  <form id="f-bprofile" class="panel" style="max-width:720px" novalidate>
    <label class="field"><span>Nombre del negocio</span><input class="in" name="name" value="${esc(b.name)}" required></label>
    <div class="row2" style="margin-top:16px"><label class="field"><span>Categoría</span><select class="in" name="category">${CATEGORIAS.map(k => `<option ${k === b.category ? 'selected' : ''}>${k}</option>`).join('')}</select></label><label class="field" style="margin-top:0"><span>Colonia</span><select class="in" name="colonia">${Object.keys(COLONIAS).map(k => `<option ${k === b.colonia ? 'selected' : ''}>${k}</option>`).join('')}</select></label></div>
    <label class="field" style="margin-top:16px"><span>Descripción</span><input class="in" name="about" maxlength="120" value="${esc(b.about || '')}"></label>
    <div class="field"><span>Contenido que te interesa</span><div class="picks" data-group="formatos" data-live>${FORMATOS.map(k => `<button type="button" class="pick ${(b.formatos || []).includes(k) ? 'on' : ''}" data-pick="${k}">${k}</button>`).join('')}</div></div>
    <div class="actions" style="margin-top:20px"><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
  </form>
  ${accountBox(u)}`;
}

/* =========================================================
   CÓMO FUNCIONA (ambos)
   ========================================================= */
function vAlgoritmo() {
  return `
  <a class="back" href="javascript:history.back()">← Volver</a>
  <header class="pagehead"><div><h1>Cómo funciona el match</h1><p class="lead">Dos reglas simples y visibles. El objetivo: que alguien que empieza tenga oportunidades reales y que el negocio corra menos riesgo.</p></div></header>
  <div class="grid2">
    <section class="panel"><h2>Colaboraciones para un creador</h2>
      <div class="bars" style="margin:10px 0 16px">${bar('Tu nicho', .45)}${bar('Cercanía', .40)}${bar('Cupos', .15)}</div>
      <ol class="small" style="margin-left:18px;display:grid;gap:6px">
        <li>Toma las colaboraciones abiertas.</li>
        <li>Mide la distancia entre colonias con la fórmula de haversine.</li>
        <li>Nicho igual vale 1 y distinto vale 0.3. La cercanía vale 1 − km ÷ 12.</li>
        <li>Suma ponderada: 45% nicho, 40% cercanía, 15% cupos.</li>
        <li>Si no tienes el nivel mínimo, la colaboración aparece al final como bloqueada.</li>
      </ol>
    </section>
    <section class="panel"><h2>Aplicantes para un negocio</h2>
      <div class="bars" style="margin:10px 0 16px">${bar('Nicho', .30)}${bar('Cercanía', .25)}${bar('Calificación', .25)}${bar('Nivel', .20)}</div>
      <ol class="small" style="margin-left:18px;display:grid;gap:6px">
        <li>Toma solo las aplicaciones pendientes.</li>
        <li>Sin calificaciones previas cuenta como 0.6, para no castigar a quien empieza.</li>
        <li>El nivel sale de las colaboraciones verificadas: 0, 1, 3 y 6 o más.</li>
        <li>Los seguidores no entran al cálculo.</li>
        <li>El negocio siempre decide al final.</li>
      </ol>
    </section>
  </div>`;
}

function notFound() { return `<div class="empty">No encontramos esta página.<br><a class="btn btn-primary btn-sm" href="#/">Ir al inicio</a></div>`; }

/* =========================================================
   ROUTER
   ========================================================= */
const PUBLIC = ['entrar', 'login', 'registro'];
const C_ROUTES = { inicio: cInicio, explorar: cExplorar, oferta: cOferta, colabs: cColabs, colab: colabDetail, portafolio: cPortafolio, perfil: cPerfil, algoritmo: vAlgoritmo };
const B_ROUTES = { resumen: bResumen, colaboraciones: bColaboraciones, nueva: bNueva, gestionar: bGestionar, colab: colabDetail, creador: bCreador, perfil: bPerfil, algoritmo: vAlgoritmo };

function render() {
  const [, route, param] = (location.hash || '#/').split('/');
  const u = me();
  const home = u ? (u.role === 'creator' ? '#/inicio' : '#/resumen') : '#/entrar';
  if (!route) { location.replace(home); return; }

  if (PUBLIC.includes(route)) {
    if (u && !(route === 'registro' && draft && draft.step === 3)) { location.replace(home); return; }
    document.body.dataset.theme = 'creator';
    document.title = 'First Take · Entrar';
    $('#app').innerHTML = route === 'entrar' ? vEntrar() : route === 'login' ? vLogin() : vRegistro(param === 'negocio' ? 'biz' : 'creator');
    authErr = '';
    return;
  }
  if (!u) { location.replace('#/entrar'); return; }

  const table = u.role === 'creator' ? C_ROUTES : B_ROUTES;
  const view = table[route];
  if (!view) { location.replace(home); return; }
  if (route !== 'nueva') nf = null;
  document.body.dataset.theme = u.role === 'creator' ? 'creator' : 'biz';
  document.title = 'First Take · ' + (u.role === 'creator' ? 'Creadores' : 'Negocios');
  $('#app').innerHTML = shell(view(param));
  const log = $('#chat-log'); if (log) log.scrollTop = log.scrollHeight;
}

/* =========================================================
   ACCIONES
   ========================================================= */
function login(uid) { S.session = uid; draft = null; save(); const u = me(); go(u.role === 'creator' ? '#/inicio' : '#/resumen'); }
function logout() { S.session = null; save(); go('#/entrar'); toast('Cerraste sesión.'); }
function setStatus(aid, st, extra) { Object.assign(appRec(aid), { status: st }, extra || {}); save(); }
function sysMsg(aid, from, text) { S.messages.push({ id: nid('m'), appId: aid, from, text, at: new Date().toISOString().slice(0, 16) }); }

document.addEventListener('click', e => {
  const t = e.target;
  const row = t.closest('[data-go]');
  if (row && !t.closest('a, button, input, select, textarea')) { go(row.dataset.go); return; }

  const demo = t.closest('[data-demo]'); if (demo) { login(demo.dataset.demo); return; }
  if (t.closest('[data-logout]')) { logout(); return; }
  if (t.closest('[data-reset]')) { S = seed(); save(); draft = null; go('#/entrar'); toast('Datos del demo reiniciados.'); return; }
  if (t.closest('[data-back-step]')) { draft.step = 1; render(); return; }

  const pk = t.closest('[data-pick]');
  if (pk) {
    const grp = pk.parentElement.dataset.group, val = pk.dataset.pick;
    if (pk.parentElement.hasAttribute('data-live')) { pk.classList.toggle('on'); if (grp === 'nicho' && pk.parentElement.querySelectorAll('.on').length > 3) { pk.classList.remove('on'); toast('Elige hasta 3.'); } return; }
    const arr = draft.data[grp];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else { if (grp === 'nicho' && arr.length >= 3) { toast('Elige hasta 3.'); return; } arr.push(val); }
    pk.classList.toggle('on', arr.includes(val));
    return;
  }

  const cat = t.closest('[data-cat]');
  if (cat) { fx.cat = cat.dataset.cat; document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat === fx.cat)); $('#results').innerHTML = exploreResults(); return; }

  const acc = t.closest('[data-accept]');
  if (acc) { const a = appRec(acc.dataset.accept); setStatus(a.id, 'aceptada'); sysMsg(a.id, 'biz', `¡Hola ${first(creator(a.creatorId).name)}! Te aceptamos. Escríbenos para acordar día y hora.`); save(); toast('Aceptada. Se creó el acuerdo y se abrió el chat.'); render(); return; }
  const rej = t.closest('[data-reject]');
  if (rej) { setStatus(rej.dataset.reject, 'rechazada'); toast('Marcada como “no por ahora”.'); render(); return; }
  const wd = t.closest('[data-withdraw]');
  if (wd) { S.apps = S.apps.filter(a => a.id !== wd.dataset.withdraw); save(); toast('Retiraste tu aplicación.'); go('#/colabs'); return; }
  const cl = t.closest('[data-close]');
  if (cl) { offer(cl.dataset.close).status = 'cerrada'; save(); toast('Colaboración cerrada.'); render(); return; }

  const st = t.closest('[data-star]');
  if (st) { const w = st.parentElement, v = +st.dataset.star; w.dataset.val = v; w.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.star <= v)); return; }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { fx.q = e.target.value; $('#results').innerHTML = exploreResults(); }
  const f = e.target.form;
  if (f && f.id === 'f-new') { const fd = new FormData(f); nf = Object.fromEntries(fd.entries()); nf.slots = +nf.slots || 1; $('#preview').innerHTML = previewCard(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'sort') { fx.sort = e.target.value; $('#results').innerHTML = exploreResults(); }
  const f = e.target.form;
  if (f && f.id === 'f-new') { const fd = new FormData(f); nf = Object.fromEntries(fd.entries()); nf.slots = +nf.slots || 1; $('#preview').innerHTML = previewCard(); }
});

function picked(form, grp) { return [...form.querySelectorAll(`[data-group="${grp}"] .pick.on`)].map(b => b.dataset.pick); }

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = Object.fromEntries(new FormData(f).entries());
  const trim = k => String(v[k] || '').trim();

  if (f.id === 'f-login') {
    const u = S.users.find(x => x.email === trim('email').toLowerCase());
    if (!u || u.pass !== hash(v.pass)) { authErr = 'El correo o la contraseña no coinciden. Revísalos o crea una cuenta.'; render(); return; }
    login(u.id); toast('Sesión iniciada.'); return;
  }
  if (f.id === 'f-reg1') {
    const email = trim('email').toLowerCase();
    Object.assign(draft.data, { name: trim('name'), email });
    if (!draft.data.name) authErr = 'Escribe tu nombre.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) authErr = 'Escribe un correo válido, por ejemplo nombre@correo.com.';
    else if (S.users.some(u => u.email === email)) authErr = 'Ya existe una cuenta con ese correo. Inicia sesión.';
    else if (String(v.pass || '').length < 6) authErr = 'La contraseña necesita al menos 6 caracteres.';
    else { draft.data.pass = hash(v.pass); draft.step = 2; }
    render(); return;
  }
  if (f.id === 'f-reg2') {
    const d = draft.data;
    if (draft.role === 'creator') {
      Object.assign(d, { handle: trim('handle'), colonia: v.colonia, followers: +v.followers || 0, bio: trim('bio') });
      if (!d.handle) { authErr = 'Escribe tu usuario de Instagram o TikTok.'; render(); return; }
      if (!d.nicho.length) { authErr = 'Elige al menos un nicho.'; render(); return; }
      if (!d.handle.startsWith('@')) d.handle = '@' + d.handle;
      const cid = nid('c'), uid = nid('u');
      S.creators.push({ id: cid, name: d.name, handle: d.handle, colonia: d.colonia, nicho: d.nicho.slice(), formatos: d.formatos.slice(), followers: d.followers, bio: d.bio });
      S.users.push({ id: uid, email: d.email, pass: d.pass, role: 'creator', profileId: cid });
      S.session = uid;
    } else {
      Object.assign(d, { bizname: trim('bizname'), category: v.category, colonia: v.colonia, about: trim('about') });
      if (!d.bizname) { authErr = 'Escribe el nombre de tu negocio.'; render(); return; }
      const bid = nid('b'), uid = nid('u');
      S.businesses.push({ id: bid, name: d.bizname, category: d.category, colonia: d.colonia, contact: d.name, about: d.about, formatos: d.formatos.slice() });
      S.users.push({ id: uid, email: d.email, pass: d.pass, role: 'biz', profileId: bid });
      S.session = uid;
    }
    draft.step = 3; save(); render(); return;
  }

  if (f.id === 'f-apply') {
    const pitch = trim('pitch');
    if (!pitch) { toast('Escribe por qué tú antes de aplicar.'); return; }
    const aid = nid('a');
    S.apps.push({ id: aid, offerId: f.dataset.id, creatorId: meC().id, pitch, status: 'pendiente' });
    save(); toast('Aplicación enviada.'); go('#/colab/' + aid); return;
  }
  if (f.id === 'f-deliver') {
    const link = trim('link'); if (!link) { toast('Pega el link de tu publicación.'); return; }
    setStatus(f.dataset.id, 'entregada', { link }); sysMsg(f.dataset.id, 'creator', `Listo, ya publiqué: ${link}`); save();
    toast('Entregada. El negocio la va a confirmar.'); render(); return;
  }
  if (f.id === 'f-confirm') {
    const review = trim('review'); if (!review) { toast('Escribe una reseña corta.'); return; }
    const a = appRec(f.dataset.id), before = levelOf(a.creatorId).n;
    setStatus(a.id, 'verificada', { rating: +f.querySelector('.star-pick').dataset.val, review });
    const after = levelOf(a.creatorId);
    toast(after.n > before ? `Verificada. ${first(creator(a.creatorId).name)} subió a ${after.name}.` : 'Verificada. Ya está en su portafolio.');
    render(); return;
  }
  if (f.id === 'f-chat') {
    const text = trim('text'); if (!text) return;
    sysMsg(f.dataset.id, me().role === 'creator' ? 'creator' : 'biz', text); save(); render();
    const inp = document.querySelector('#f-chat .in'); if (inp) inp.focus();
    return;
  }
  if (f.id === 'f-new') {
    const err = $('#new-err');
    if (!trim('title') || !trim('gives') || !trim('asks')) { err.textContent = 'Completa título, qué ofreces y qué pides.'; err.hidden = false; return; }
    const o = { id: nid('o'), bizId: meB().id, status: 'abierta', title: trim('title'), gives: trim('gives'), asks: trim('asks'), category: v.category, colonia: v.colonia, slots: Math.max(1, Math.min(10, +v.slots || 1)), deadline: v.deadline, minLevel: +v.minLevel || 0, img: CAT[v.category] };
    S.offers.unshift(o); save(); nf = null;
    toast('Publicada. Ya la ven los creadores.'); go('#/gestionar/' + o.id); return;
  }
  if (f.id === 'f-cprofile') {
    const c = meC(), nicho = picked(f, 'nicho');
    if (!nicho.length) { toast('Elige al menos un nicho.'); return; }
    Object.assign(c, { name: trim('name') || c.name, handle: trim('handle') || c.handle, colonia: v.colonia, followers: +v.followers || 0, bio: trim('bio'), nicho, formatos: picked(f, 'formatos') });
    save(); toast('Guardaste tu perfil.'); render(); return;
  }
  if (f.id === 'f-bprofile') {
    const b = meB();
    Object.assign(b, { name: trim('name') || b.name, category: v.category, colonia: v.colonia, about: trim('about'), formatos: picked(f, 'formatos') });
    save(); toast('Guardaste los datos del negocio.'); render(); return;
  }
});

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
